---
layout: default
---

<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 md:py-20">
  <header class="mb-10 text-center">
    <h1 class="text-3xl md:text-5xl font-extrabold text-slate-900 dark:text-white leading-tight mb-4">
      {{ page.title }}
    </h1>
    {% if page.subtitle %}
      <p class="text-lg text-slate-500 dark:text-slate-400">
        {{ page.subtitle }}
      </p>
    {% endif %}
  </header>

  <div class="prose prose-slate dark:prose-invert max-w-none text-slate-700 dark:text-slate-300 leading-relaxed text-base space-y-6">
    {{ content }}
  </div>
</div>
